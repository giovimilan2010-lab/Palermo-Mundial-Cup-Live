<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Giocatori | Palermo Mundial Cup</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<img src="1000391582.jpg" class="logo" alt="Palermo Mundial Cup">

<h1>👥 GIOCATORI</h1>

<p>Cerca qualsiasi giocatore del torneo</p>

</header>



<section class="menu-card">


<h2 style="text-align:center;">
🔍 Cerca Giocatore
</h2>


<input 
type="text" 
id="ricerca"
placeholder="Scrivi il nome del giocatore..."
>


<div id="risultati">

<p>Inizia a cercare un giocatore...</p>

</div>


</section>



<div style="text-align:center;margin:30px;">

<a href="index.html" class="menu-btn">

⬅ Torna alla Home

</a>

</div>



<footer>

<p>Palermo Mundial Cup © 2026</p>

</footer>



<script src="giocatori.js"></script>


<script>


const ricerca = document.getElementById("ricerca");
const risultati = document.getElementById("risultati");


ricerca.addEventListener("input", function(){


let testo = ricerca.value.toLowerCase();



if(testo.length === 0){

risultati.innerHTML = "<p>Inizia a cercare un giocatore...</p>";

return;

}



let trovati = giocatori.filter(giocatore =>

giocatore.nome.toLowerCase().includes(testo)

);



if(trovati.length === 0){

risultati.innerHTML = "<p>Nessun giocatore trovato</p>";

return;

}



risultati.innerHTML = "";



trovati.forEach(giocatore => {


risultati.innerHTML += `


<div class="risultato-giocatore">


${giocatore.bandiera}

<strong>${giocatore.nome}</strong>


<br>


<span>

${giocatore.squadra}

</span>


</div>


`;


});


});


</script>



</body>

</html>
