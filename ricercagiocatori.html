<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Giocatori | Palermo Mundial Cup</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<header>

<img src="1000391582.jpg" class="logo" alt="Palermo Mundial Cup">

<h1>👥 GIOCATORI</h1>

<p>Cerca qualsiasi giocatore del torneo</p>

</header>


<section class="menu-card">

<h2 style="text-align:center;">
🔍 Cerca Giocatore
</h2>


<input
id="ricerca"
type="text"
placeholder="Scrivi il nome del giocatore..."
disabled
>


<div id="risultati">

<p>Caricamento giocatori...</p>

</div>


</section>


<div style="text-align:center;margin:30px;">

<a href="index.html" class="menu-btn">

⬅ Torna alla Home

</a>

</div>


<footer>

Palermo Mundial Cup © 2026

</footer>


<script src="giocatori.js"></script>


<script>

const ricerca = document.getElementById("ricerca");

const risultati = document.getElementById("risultati");


document.addEventListener("giocatoriCaricati", function() {

    ricerca.disabled = false;

    risultati.innerHTML =
    "<p>Inizia a cercare un giocatore...</p>";

});


ricerca.addEventListener("input", () => {

    let testo = ricerca.value
        .toLowerCase()
        .trim();


    if (testo === "") {

        risultati.innerHTML =
        "<p>Inizia a cercare un giocatore...</p>";

        return;

    }


    let trovati = giocatori.filter(g =>

        g.nome
        .toLowerCase()
        .includes(testo)

    );


    if (trovati.length === 0) {

        risultati.innerHTML =
        "<p>Nessun giocatore trovato</p>";

        return;

    }


    risultati.innerHTML = "";


    trovati.forEach(g => {

        risultati.innerHTML += `

        <a href="giocatore.html?id=${g.id}" class="risultato-giocatore">

        ${g.bandiera}

        <strong>${g.nome}</strong>

        <br>

        <span>${g.squadra}</span>

        </a>

        `;

    });

});

</script>


</body>

</html>
